<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯 Playlist - 簡報後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    /* Page-specific layout for the picker UI */
    .meta-row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      align-items: flex-end;
    }
    .meta-row .field { flex: 1; }
    .meta-row label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #6b5e50;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .meta-row input[type=text] {
      width: 100%;
      padding: 10px 12px;
      background: #ece5d4;
      border: 1px solid #d2c6ab;
      border-radius: 6px;
      color: #312922;
      font-size: 15px;
    }
    .meta-row input[type=text]:focus { outline: none; border-color: #2c6cb5; }

    .picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 480px;
    }
    .panel {
      background: #fbf8f0;
      border: 1px solid #d2c6ab;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 18px;
      background: #e1d8c3;
      border-bottom: 1px solid #d2c6ab;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .panel-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      font-family: var(--font-display);
      color: #312922;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .panel-head h3 .material-symbols-rounded { font-size: 18px; color: #2a87a8; }
    .panel-head .filter-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .panel-head .filter-wrap .material-symbols-rounded {
      position: absolute;
      left: 10px;
      font-size: 18px;
      color: #8a7e6f;
      pointer-events: none;
    }
    .panel-head .filter {
      width: 100%;
      padding: 8px 10px 8px 34px;
      background: #ece5d4;
      border: 1px solid #d2c6ab;
      border-radius: 6px;
      color: #312922;
      font-size: 13px;
    }
    .panel-head .filter:focus { outline: none; border-color: #2c6cb5; }
    .panel-head .count-pill {
      font-size: 12px;
      color: #4d4339;
      background: #d2c6ab;
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .panel-foot {
      border-top: 1px solid #d2c6ab;
      padding: 10px 12px;
      background: #e1d8c3;
    }
    .panel-foot .pager { margin-top: 0; flex-wrap: wrap; }
    .item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      border-bottom: 1px solid #d2c6ab;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #eee5d0; }
    .item .title {
      flex: 1;
      font-size: 14px;
      min-width: 0;
      overflow: hidden;
    }
    .item .title-text {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #312922;
    }
    .item .doc-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
      font-size: 11px;
      color: #8a7e6f;
    }
    .item .doc-id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .item .doc-date::before {
      content: "•";
      margin-right: 8px;
      color: #b8a785;
    }
    .item .index {
      width: 26px;
      height: 26px;
      border-radius: 13px;
      background: #2c6cb5;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }
    .item .icon-btn-sm {
      background: transparent;
      border: 1px solid #b8a785;
      color: #4d4339;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .item .icon-btn-sm .material-symbols-rounded { font-size: 18px; }
    .item .icon-btn-sm:hover:not(:disabled) {
      background: #d2c6ab;
      color: #2a87a8;
      border-color: #b8a785;
    }
    .item .icon-btn-sm.danger:hover {
      background: #f5dbcf;
      border-color: #9a3324;
      color: #9a3324;
    }
    .item .icon-btn-sm.primary {
      background: #2c6cb5;
      border-color: #2c6cb5;
      color: white;
    }
    .item .icon-btn-sm.primary:hover { background: #1f5598; border-color: #1f5598; }
    .item .icon-btn-sm:disabled { opacity: 0.3; cursor: not-allowed; }
    .picker .empty {
      padding: 40px 20px;
      text-align: center;
      color: #8a7e6f;
      font-size: 13px;
      line-height: 1.6;
    }
    .picker .empty .material-symbols-rounded {
      font-size: 32px;
      color: #b8a785;
      display: block;
      margin: 0 auto 10px;
    }

    .footer-bar {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      align-items: center;
    }
    .footer-bar .left {
      flex: 1;
      color: #6b5e50;
      font-size: 13px;
    }
    .footer-bar button.secondary {
      background: transparent;
      border: 1px solid #b8a785;
      color: #4d4339;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .footer-bar button.secondary:hover { background: #d2c6ab; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>簡報後台</h1>
    <nav>
      <a href="/admin">文件</a>
      <a href="/admin/playlists" class="active">Playlists</a>
    </nav>
  </header>

  <main>
    <div class="section-header">
      <h2 id="pageTitle">新增 Playlist</h2>
    </div>

    <div class="meta-row">
      <div class="field">
        <label for="title">標題</label>
        <input id="title" type="text" placeholder="例：2026 第一季">
      </div>
      <div>
        <label>公開</label>
        <label class="toggle" style="margin-top:4px">
          <input id="isPublic" type="checkbox">
          <span class="track"></span>
        </label>
      </div>
    </div>

    <div class="picker">
      <div class="panel">
        <div class="panel-head">
          <h3><span class="material-symbols-rounded">folder_open</span>可選文件</h3>
          <div class="filter-wrap">
            <span class="material-symbols-rounded">search</span>
            <input class="filter" id="filter" type="text" placeholder="搜尋標題或 doc_id">
          </div>
        </div>
        <div class="panel-body" id="available">
          <div class="empty">載入中…</div>
        </div>
        <div class="panel-foot">
          <div class="pager" id="availablePager"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3><span class="material-symbols-rounded">queue_music</span>已加入（順序）</h3>
          <span class="count-pill" id="selectedCount" style="display:none"></span>
        </div>
        <div class="panel-body" id="selected">
          <div class="empty">
            <span class="material-symbols-rounded">add_circle</span>
            點左側文件加入清單
          </div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="left" id="status"></div>
      <a href="/admin/playlists" class="secondary" style="text-decoration:none;color:inherit;display:inline-block">取消</a>
      <button class="primary" id="saveBtn">儲存</button>
    </div>
  </main>

  <script type="module" src="/admin/js/playlist-edit.js"></script>
</body>
</html>
