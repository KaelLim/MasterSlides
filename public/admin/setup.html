<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初次設定 - 簡報後台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="auth-page">
    <form class="auth-card" id="setupForm" autocomplete="on">
      <h1>初次設定</h1>
      <p class="subtitle">建立第一個管理者帳號。之後此頁面不再開放。</p>
      <label for="email">電子郵件</label>
      <input id="email" name="email" type="email" required autocomplete="email" autofocus>
      <label for="password">密碼 <span style="font-weight:400;text-transform:none;color:#8a9aae">（至少 8 字元）</span></label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <button type="submit" id="submit">建立並登入</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script type="module">
    // If an admin already exists, this page is locked — redirect to login.
    const s = await fetch("/api/admin/setup-state");
    if (s.ok && !(await s.json()).needsSetup) {
      window.location.replace("/admin/login");
    }

    const form = document.getElementById("setupForm");
    const submit = document.getElementById("submit");
    const errEl = document.getElementById("error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      submit.disabled = true;
      submit.textContent = "建立中…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/admin/setup", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          errEl.textContent = body.error === "already-set-up"
            ? "已經有管理者，請前往登入頁"
            : `建立失敗（${body.error || res.status}）`;
          submit.disabled = false;
          submit.textContent = "建立並登入";
          return;
        }
        window.location.replace("/admin");
      } catch (err) {
        errEl.textContent = `網路錯誤：${err.message}`;
        submit.disabled = false;
        submit.textContent = "建立並登入";
      }
    });
  </script>
</body>
</html>
