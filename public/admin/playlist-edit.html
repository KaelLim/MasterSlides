<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯 Playlist - 簡報後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <!-- Picker styles extracted to admin.css. See admin.css "Playlist Editor" section. -->
</head>
<body>
  <header class="topbar">
    <h1>簡報後台</h1>
    <nav>
      <a href="/admin">文件</a>
      <a href="/admin/playlists" class="active">Playlists</a>
    </nav>
  </header>

  <main>
    <div class="section-header">
      <h2 id="pageTitle">新增 Playlist</h2>
    </div>

    <div class="meta-row">
      <div class="field">
        <label for="title">標題</label>
        <input id="title" type="text" placeholder="例：2026 第一季">
      </div>
      <div>
        <label>公開</label>
        <label class="toggle" style="margin-top:4px">
          <input id="isPublic" type="checkbox">
          <span class="track"></span>
        </label>
      </div>
    </div>

    <div class="picker">
      <div class="panel">
        <div class="panel-head">
          <h3><span class="material-symbols-rounded">folder_open</span>可選文件</h3>
          <div class="filter-wrap">
            <span class="material-symbols-rounded">search</span>
            <input class="filter" id="filter" type="text" placeholder="搜尋標題或 doc_id">
          </div>
        </div>
        <div class="panel-body" id="available">
          <div class="empty">載入中…</div>
        </div>
        <div class="panel-foot">
          <div class="pager" id="availablePager"></div>
        </div>
      </div>

      <div class="panel selected-panel">
        <div class="panel-head">
          <h3><span class="material-symbols-rounded">queue_music</span>已加入（順序）</h3>
          <div class="filter-wrap">
            <span class="material-symbols-rounded">search</span>
            <input class="filter" id="selectedFilter" type="text" placeholder="搜尋標題或 doc_id">
          </div>
          <span class="count-pill" id="selectedCount" style="display:none"></span>
        </div>
        <div class="panel-body" id="selected">
          <div class="empty">
            <span class="material-symbols-rounded">add_circle</span>
            點左側文件加入清單
          </div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="left" id="status"></div>
      <a href="/admin/playlists" class="secondary" style="text-decoration:none;color:inherit;display:inline-block">取消</a>
      <button class="primary" id="saveBtn">儲存</button>
    </div>
  </main>

  <script type="module" src="/admin/js/playlist-edit.js"></script>
</body>
</html>
