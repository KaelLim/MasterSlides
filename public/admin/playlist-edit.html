<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯 Playlist - 簡報後台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    /* Page-specific layout for the picker UI */
    .meta-row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      align-items: flex-end;
    }
    .meta-row .field { flex: 1; }
    .meta-row label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8a9aae;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .meta-row input[type=text] {
      width: 100%;
      padding: 10px 12px;
      background: #0f1722;
      border: 1px solid #2a3a52;
      border-radius: 6px;
      color: #e3e8ee;
      font-size: 15px;
    }
    .meta-row input[type=text]:focus { outline: none; border-color: #2563eb; }

    .picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 420px;
    }
    .panel {
      background: #1a2332;
      border: 1px solid #2a3a52;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 12px 16px;
      background: #14202d;
      border-bottom: 1px solid #2a3a52;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .panel-head h3 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8a9aae;
      flex: 1;
    }
    .panel-head .filter {
      flex: 1;
      padding: 6px 10px;
      background: #0f1722;
      border: 1px solid #2a3a52;
      border-radius: 5px;
      color: #e3e8ee;
      font-size: 13px;
    }
    .panel-head .filter:focus { outline: none; border-color: #2563eb; }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
      border-bottom: 1px solid #1f2c3d;
      cursor: pointer;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #1e2a3a; }
    .item .title { flex: 1; font-size: 14px; }
    .item .doc-id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: #6b7c8f;
    }
    .item .index {
      width: 22px;
      height: 22px;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .item .small-btn {
      background: transparent;
      border: 1px solid #3a4a62;
      color: #cdd6e2;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .item .small-btn:hover { background: #2a3a52; }
    .picker .empty { padding: 20px; text-align: center; color: #6b7c8f; font-size: 13px; }

    .footer-bar {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      align-items: center;
    }
    .footer-bar .left {
      flex: 1;
      color: #8a9aae;
      font-size: 13px;
    }
    .footer-bar button.secondary {
      background: transparent;
      border: 1px solid #3a4a62;
      color: #cdd6e2;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .footer-bar button.secondary:hover { background: #2a3a52; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>簡報後台</h1>
    <nav>
      <a href="/admin">文件</a>
      <a href="/admin/playlists" class="active">Playlists</a>
    </nav>
    <div class="user">
      <span class="email" id="userEmail"></span>
      <button id="logoutBtn">登出</button>
    </div>
  </header>

  <main>
    <div class="section-header">
      <h2 id="pageTitle">新增 Playlist</h2>
    </div>

    <div class="meta-row">
      <div class="field">
        <label for="title">標題</label>
        <input id="title" type="text" placeholder="例：2026 第一季">
      </div>
      <div>
        <label>公開</label>
        <label class="toggle" style="margin-top:4px">
          <input id="isPublic" type="checkbox">
          <span class="track"></span>
        </label>
      </div>
    </div>

    <div class="picker">
      <div class="panel">
        <div class="panel-head">
          <h3>可選文件（公開）</h3>
          <input class="filter" id="filter" type="text" placeholder="🔍 搜尋標題或 doc_id">
        </div>
        <div class="panel-body" id="available">
          <div class="empty">載入中…</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>已加入（順序）</h3>
          <span style="font-size:12px;color:#8a9aae" id="selectedCount"></span>
        </div>
        <div class="panel-body" id="selected">
          <div class="empty">點左側文件加入清單</div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="left" id="status"></div>
      <a href="/admin/playlists" class="secondary" style="text-decoration:none;color:inherit;display:inline-block">取消</a>
      <button class="primary" id="saveBtn">儲存</button>
    </div>
  </main>

  <script type="module" src="/admin/js/playlist-edit.js"></script>
</body>
</html>
